<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include_('Styles') ?>
</head>
<body>
  <header class="bar">
    <h1><span class="mark" aria-hidden="true">P</span>駐車場の台帳</h1>
    <div class="row nowrap"><span class="who" id="who"></span><button type="button" class="btn t-calls" id="calls" hidden>電話連絡 <span class="badge zero" id="calls-n">0</span></button><button type="button" class="btn plain only-wide" id="logout" hidden>管理を終える</button></div>
  </header>
  <main class="page">
    <section id="login" hidden></section>
    <section id="app" hidden>
      <div class="tools no-print" id="tools">
        <button type="button" class="btn t-prev" id="prev"><span class="tx">前の月</span></button>
        <button type="button" class="btn t-this" id="this">今月</button>
        <button type="button" class="btn t-next" id="next"><span class="tx">次の月</span></button>
        <h2 id="h-week" class="num t-week"></h2>
        <form id="sf" class="row t-find" role="search" novalidate>
          <input class="in" id="q" autocomplete="off" placeholder="名前・部屋・予約番号" aria-label="名前・部屋・予約番号で探す">
          <button type="submit" class="btn">探す</button>
        </form>
        <button type="button" class="btn t-block" id="blocks">使用禁止</button>
        <button type="button" class="btn t-sheet" id="sheetview" aria-pressed="false">予約表</button>
        <button type="button" class="btn only-wide t-print" id="print">印刷</button>
        <button type="button" class="btn plain only-narrow t-out" id="logout2">管理を終える</button>
      </div>
      <div class="split" id="split">
        <section id="board" aria-label="台帳"></section>
        <aside class="panel sheet-over" id="panel" hidden aria-live="polite" role="dialog" aria-labelledby="h-panel"></aside>
      </div>
    </section>
  </main>

  <?!= include_('Common') ?>
  <script>
  (function () {
    'use strict';
    var PANEL_Y = 0;
    var esc = App.esc, $ = App.$;
    var TODAY = <?= today ?>;
    var IDS = ['S1', 'S2', 'S3', 'S4'];
    var SPACES = ['91', '92', '93'];
    var REASONS = ['本人から電話', '本人から窓口で', '管理者の判断'];
    var BLOCK_REASONS = ['管理者が使う', '工事・点検', '行事', 'その他'];
    var SLOT_LABEL = { S1: 'A 朝', S2: 'B 昼', S3: 'C 午後', S4: 'D 夜' };
    var A = {
      token: App.session.get('adminToken'), name: App.session.get('adminName') || '',
      page: null, avail: {}, resv: [], byId: {}, view: null, ctx: null, cap: SPACES.length, maxQ: 1, blocks: [], blockById: {},
      mode: 'week', month: TODAY.slice(0, 7), table: null, exported: null, draft: newDraft(),
    };
    /** 登録の入力（お名前・部屋番号など）。枠を押し直しても、閉じても、登録できるまで残す（電話口では名前を先に聞くため。D-022） */
    function newDraft() { return { channel: 'PHONE', form: { name: '', building: '', room: '', phone: '', email: '' } }; }

    /** 区画の札を並べる */
    function plates(list) { return list.map(function (sp) { return '<span class="plate">' + esc(sp) + '</span>'; }).join(' '); }
    function monday(d) { var w = App.dow(d); return App.addDays(d, w === 0 ? -6 : 1 - w); }
    function surname(n) { return String(n || '').split(/[\s　]+/)[0].slice(0, 5); }

    /** 管理者用の関数を呼ぶ。確認が切れていたら確認画面に戻す */
    function adminCall(fn) {
      var args = Array.prototype.slice.call(arguments, 1);
      return App.call.apply(null, [fn, { token: A.token }].concat(args)).then(function (r) {
        if (r && r.status === 'DENIED') { logout('もう一度、管理者の確認をしてください'); throw new Error('denied'); }
        return r;
      });
    }

    // ------------------------------------------------------------ 管理者の確認
    function showLogin(msg) {
      $('app').hidden = true; $('login').hidden = false; $('logout').hidden = true; $('calls').hidden = true; $('who').textContent = '';
      $('login').innerHTML = '<div style="max-width: 26rem"><h2 id="h-login">管理者の確認</h2>' + (msg ? App.note('wait', msg, '') : '')
        + '<form id="lg" novalidate><div class="f"><label for="lg-email">メールアドレス</label><input class="in" id="lg-email" type="email" autocomplete="username"></div>'
        + '<div class="f"><label for="lg-pass">パスコード</label><input class="in" id="lg-pass" type="password" autocomplete="current-password"></div>'
        + '<button type="submit" class="btn main wide" id="lg-go">確認して進む</button></form><div id="lg-out"></div></div>';
      $('lg').onsubmit = function (e) {
        e.preventDefault();
        var errs = {};
        if (!$('lg-email').value.trim()) errs['lg-email'] = 'メールアドレスを入れてください';
        if (!$('lg-pass').value.trim()) errs['lg-pass'] = 'パスコードを入れてください';
        if (!App.showErrors($('lg'), errs)) return;
        $('lg-go').disabled = true; $('lg-out').innerHTML = App.busy('確認しています');
        App.call('api_admin_login', { email: $('lg-email').value.trim(), secret: $('lg-pass').value.trim() }).then(function (r) {
          $('lg-go').disabled = false;
          if (r && r.status === 'OK') {
            A.token = r.token; A.name = r.name; App.session.set('adminToken', r.token); App.session.set('adminName', r.name);
            showApp();
          } else {
            $('lg-out').innerHTML = r && r.reason === 'LOCKED'
              ? App.note('ng', 'しばらく確認できません', '（' + (r.reasonText || '15分後に試してください') + '）')
              : App.note('ng', '確認できませんでした', 'メールアドレスかパスコードが違います。' + (r && r.lockout ? '5回続けて間違えると15分止まります。' : ''));
          }
        }, function () { $('lg-go').disabled = false; $('lg-out').innerHTML = App.note('wait', '通信がつながりませんでした', ''); });
      };
    }
    function logout(msg) {
      A.token = null; LOADED = {}; loadedAt = 0; A.avail = {}; A.resv = []; A.blocks = []; App.session.del('adminToken'); App.session.del('adminName'); A.draft = newDraft();
      closePanel(true); showLogin(msg);
    }
    $('logout').onclick = $('logout2').onclick = function () { logout('管理を終えました'); };

    function showApp() {
      $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false; $('calls').hidden = false;
      $('who').textContent = A.name + ' さん';
      loadBoard(); loadCalls();
    }

    // ------------------------------------------------------------ 予約表
    // 週の表の中身は、月ごとに読んで持っておく（D-038）。開いたときは今月と来月を読み、週を送っても待たない。
    // その先の月は、そこへ行ったときに1か月ずつ読む。登録・取消し・変更の後と、画面に戻ったときは読み直す
    var LOADED = {}; // 読んである月（'YYYY-MM' → true）
    var loadedAt = 0;
    function monthOf(d) { return d.slice(0, 7); }
    function monthEnd(m) { return App.addDays(App.shiftMonth(m, 1) + '-01', -1); }
    /** 月の並び（続いたもの）を読む。サーバーは1回に62日までなので、2か月ずつに分けて読む */
    function loadMonths(list) {
      var chunks = [];
      for (var i = 0; i < list.length; i += 2) chunks.push(list.slice(i, i + 2));
      return Promise.all(chunks.map(function (c) {
        var from = c[0] + '-01', to = monthEnd(c[c.length - 1]);
        // 空き状況・予約一覧・使用禁止を1回で受け取る（サーバーを3回呼ばない）
        return adminCall('api_admin_week', { from: from, to: to }).then(function (r) {
          if (!r || r.status !== 'OK') throw new Error('load');
          return { from: from, to: to, r: r, months: c };
        });
      })).then(function (rs) {
        rs.forEach(function (x) {
          var av = x.r.availability || {};
          A.cap = av.capacity || SPACES.length; A.maxQ = av.maxQuantity || 1;
          (av.days || []).forEach(function (d) { A.avail[d.date] = d; });
          A.resv = A.resv.filter(function (y) { return y.date < x.from || y.date > x.to; })
            .concat((x.r.reservations || []).filter(function (y) { return y.state === '確定'; }));
          A.resv.forEach(function (y) { A.byId[y.reservationId] = y; });
          A.blocks = A.blocks.filter(function (b) { return b.to < x.from || b.from > x.to; }).concat(x.r.blocks || []);
          A.blocks.forEach(function (b) { A.blockById[b.blockId] = b; });
          x.months.forEach(function (m) { LOADED[m] = true; });
        });
        loadedAt = Date.now();
      });
    }
    // 台帳の頁（D-040）。月の単位で「前の月・次の月」で移る（住民の画面と同じ導線）。
    // 最初の頁だけが特別で、今日を含む週の月曜から来月の終わりまで（今月と来月の表を縦に並べる）。
    // 「次の月」で来月だけ → 再来月だけ、と1か月ずつ。来月から「前の月」で最初の頁に戻る。A.page は null（最初の頁）か 'YYYY-MM'
    var THIS_M = monthOf(TODAY), NEXT_M = App.shiftMonth(THIS_M, 1);
    function pageFrom() { return A.page ? A.page + '-01' : monday(TODAY); }
    function pageTo() { return monthEnd(A.page || NEXT_M); }
    function pageDays() { var out = []; for (var d = pageFrom(); d <= pageTo(); d = App.addDays(d, 1)) out.push(d); return out; }
    function nextPage(p) { var m = App.shiftMonth(p || NEXT_M, 1); if (!p) return NEXT_M; return m === THIS_M ? null : m; }
    function prevPage(p) { if (!p) return App.shiftMonth(THIS_M, -1); var m = App.shiftMonth(p, -1); return m === THIS_M ? null : m; }
    function pageTitle() {
      if (!A.page) return (+THIS_M.slice(5)) + '月・' + (+NEXT_M.slice(5)) + '月';
      return '<span class="only-wide">' + A.page.slice(0, 4) + '年</span>' + (+A.page.slice(5)) + '月';
    }
    /** 見ている頁を出す。fresh のときは、持っている中身を捨てて読み直す（登録・取消し・変更の後など） */
    function loadBoard(fresh) {
      if (A.mode === 'month') return loadMonth();
      $('h-week').innerHTML = pageTitle();
      if (fresh === true) LOADED = {};
      var need = [];
      for (var m = monthOf(pageFrom()); m <= monthOf(pageTo()); m = App.shiftMonth(m, 1)) need.push(m);
      var list = need.filter(function (x) { return !LOADED[x]; });
      if (!list.length) { renderBoard(); return Promise.resolve(); }
      // 読み直しのときは、今の表を出したまま待つ（表が一度消えないように）
      if (!pageShown()) $('board').innerHTML = App.busy('読み込んでいます');
      var want = A.page;
      // 読んでいる間に予約表（月）へ切り替えた・別の頁へ移ったときは、描かない（後から描くと、ほかの表を上書きする）
      return loadMonths(list).then(function () { if (A.mode === 'week' && A.page === want) renderBoard(); }, retryOn(function () { loadBoard(fresh); }));
    }
    /** 見ている頁の日が、全て読んである */
    function pageShown() { return !!(A.avail[pageFrom()] && A.avail[pageTo()]); }
    // 画面に戻ったとき（ほかの管理者が入れた予約を見せるため）。1分より前に読んだものだけ読み直す
    document.addEventListener('visibilitychange', function () {
      if (document.hidden || $('app').hidden || A.mode !== 'week' || !loadedAt || Date.now() - loadedAt < 60000) return;
      loadBoard(true);
    });
    /** 読込みが通信で失敗したとき：「もう一度読み込む」を出す（確認切れのときは確認画面に戻っている） */
    function retryOn(load) {
      return function (e) {
        if (e && e.message === 'denied') return;
        $('board').innerHTML = App.note('wait', '通信がつながりませんでした', '') + '<button type="button" class="btn main" id="re">もう一度読み込む</button>';
        $('re').onclick = load;
      };
    }

    function at(date, slotId, space) {
      return A.resv.filter(function (x) { return x.date === date && x.slotId === slotId && x.spaces.indexOf(space) >= 0; })[0];
    }
    function slotMeta(date, id) { var d = A.avail[date]; return d && d.slots.filter(function (s) { return s.slotId === id; })[0]; }
    /** そのコマにあと何台入れられるか（1コマの台数の上限と、使用禁止を考えた数。サーバーが数える） */
    function room(date, slotId) { var s = slotMeta(date, slotId); return s ? s.remaining : 0; }
    /** その枠の区画を止めている使用禁止 */
    function blockAt(date, slotId, space) {
      return A.blocks.filter(function (b) {
        return date >= b.from && date <= b.to && (!b.slots.length || b.slots.indexOf(slotId) >= 0) && (!b.spaces.length || b.spaces.indexOf(space) >= 0);
      })[0];
    }

    function cellHtml(date, s, space) {
      var x = at(date, s.slotId, space);
      var where = App.md(date) + ' ' + App.slotName(s) + ' ' + space + '番';
      var sel = A.ctx && A.ctx.date === date && A.ctx.slotId === s.slotId && (A.ctx.space === space || (x && A.ctx.rid === x.reservationId));
      // 過ぎた時間は灰色のまま、登録・取消し・使用禁止の確認はできる（あとから台帳を直すため）
      var past = s.past ? ' past' : '';
      if (x) return '<button type="button" class="cell taken' + past + (sel ? ' picked' : '') + '" data-rid="' + esc(x.reservationId) + '" data-date="' + date + '" data-slot="' + s.slotId + '" aria-label="' + esc(where + ' ' + x.name + 'さん') + '">' + esc(surname(x.name)) + '</button>';
      if (s.closed && !s.past) return '<span class="cell closed" aria-label="' + esc(where + ' 受付時間外') + '"></span>';
      var bk = blockAt(date, s.slotId, space);
      if (bk) return '<button type="button" class="cell block' + past + (A.ctx && A.ctx.blockId === bk.blockId ? ' picked' : '') + '" data-block="' + esc(bk.blockId) + '" aria-label="' + esc(where + ' 使用禁止 ' + bk.reason) + '">' + (bk.reason === '管理者が使う' ? '管理者' : '禁止') + '</button>';
      // 住民の分は上限（2台）に達した。残りの区画は、管理者が使うときだけ押す
      if (!room(date, s.slotId) && s.past) return '<span class="cell cap past" aria-label="' + esc(where + ' ' + A.cap + '台で満車') + '">満</span>';
      if (!room(date, s.slotId)) return '<button type="button" class="cell cap" data-use="' + space + '" data-date="' + date + '" data-slot="' + s.slotId + '" aria-label="' + esc(where + ' ' + A.cap + '台で満車') + '">満</button>';
      return '<button type="button" class="cell add' + past + (sel ? ' picked' : '') + '" data-date="' + date + '" data-slot="' + s.slotId + '" data-space="' + space + '" aria-label="' + esc(where + (s.past ? ' 空き（過ぎた時間）' : ' 空き')) + '"></button>';
    }

    var TAB_COLS = 4; // スマホの日付の札の列の数（Styles の .daytabs と同じ）
    /** スマホ：1日の表（時間帯 × 区画） */
    function dayTable(date) {
      var h = ['<div class="dt-day" id="dt-day"><h3>' + esc(App.md(date)) + (date === TODAY ? '<span class="today-tag">今日</span>' : '') + '</h3>'];
      h.push('<table class="sheet"><colgroup><col style="width: 26%"><col><col><col></colgroup><thead><tr><th scope="col">時間帯</th>' + SPACES.map(function (sp) { return '<th scope="col"><span class="plate">' + sp + '</span></th>'; }).join('') + '</tr></thead><tbody>');
      A.avail[date].slots.forEach(function (s) {
        h.push('<tr><th scope="row" style="font-size:16px; padding: 2px 4px">' + App.markTag(s.slotId) + esc(s.label) + '<span class="t" style="display:block; font-weight:400">' + App.slotShort(s.slotId) + '</span></th>'
          + SPACES.map(function (sp) { return '<td>' + cellHtml(date, s, sp) + '</td>'; }).join('') + '</tr>');
      });
      h.push('</tbody></table></div>');
      return h.join('');
    }
    function renderBoard() {
      var days = pageDays().filter(function (d) { return A.avail[d]; });
      if (!days.length) { $('board').innerHTML = ''; return; }
      var metas = A.avail[days[0]].slots;
      var wide = window.matchMedia('(min-width: 900px)').matches;
      var h = [];
      // 月ごとに表を分けて離し、月の見出しを付ける（別の月だと分かるように。D-038・D-040）
      var groups = [];
      days.forEach(function (d) { var g = groups[groups.length - 1]; if (g && g.m === monthOf(d)) g.days.push(d); else groups.push({ m: monthOf(d), days: [d] }); });
      if (wide) {
        groups.forEach(function (g) {
          if (groups.length > 1) h.push('<h3 class="month-h">' + (+g.m.slice(5)) + '月</h3>');
          h.push('<table class="sheet"><colgroup><col style="width: 14%">' + Array(13).join('<col>') + '</colgroup><thead><tr><th rowspan="2" scope="col">日付</th>');
          metas.forEach(function (s) { h.push('<th colspan="3" class="slotsep" scope="colgroup">' + App.markTag(s.slotId) + esc(s.label) + ' <span class="t" style="display:inline">' + App.slotShort(s.slotId) + '</span></th>'); });
          h.push('</tr><tr>');
          metas.forEach(function () { SPACES.forEach(function (sp, j) { h.push('<th scope="col"' + (j === 0 ? ' class="slotsep"' : '') + '><span class="plate">' + sp + '</span></th>'); }); });
          h.push('</tr></thead><tbody>');
          g.days.forEach(function (date) {
            var dc = App.dayCell(date, TODAY);
            h.push('<tr' + (date === TODAY ? ' class="today"' : '') + '><th scope="row" class="' + dc.cls + '">' + dc.html + '</th>');
            A.avail[date].slots.forEach(function (s) { SPACES.forEach(function (sp, j) { h.push('<td' + (j === 0 ? ' class="slotsep"' : '') + '>' + cellHtml(date, s, sp) + '</td>'); }); });
            h.push('</tr>');
          });
          h.push('</tbody></table>');
        });
      } else {
        // 過ぎた日は、予約がある日だけ出す（過ぎた日で札が埋まらないように）
        var shown = days.filter(function (d) { return d >= TODAY || A.resv.some(function (x) { return x.date === d; }); });
        if (!shown.length) shown = days;
        if (shown.indexOf(A.day) < 0) A.day = shown.indexOf(TODAY) >= 0 ? TODAY : shown[0];
        var sg = [];
        shown.forEach(function (d) { var g = sg[sg.length - 1]; if (g && g.m === monthOf(d)) g.days.push(d); else sg.push({ m: monthOf(d), days: [d] }); });
        sg.forEach(function (g) {
          if (sg.length > 1) h.push('<h3 class="month-h">' + (+g.m.slice(5)) + '月</h3>');
          // 押した日の表は、その札の列のすぐ下に開く（札が多くても、押した所から離れないように）
          var at0 = g.days.indexOf(A.day), rowEnd = at0 < 0 ? -1 : Math.min(g.days.length - 1, Math.floor(at0 / TAB_COLS) * TAB_COLS + TAB_COLS - 1);
          h.push('<div class="daytabs" role="group" aria-label="' + (+g.m.slice(5)) + '月の日付">' + g.days.map(function (d, i) {
            var free = 0; A.avail[d].slots.forEach(function (s) { if (!s.closed) free += room(d, s.slotId); });
            var w = App.dow(d);
            return '<button type="button" class="dt' + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') + '" data-day="' + d + '" aria-pressed="' + (d === A.day) + '" aria-label="' + esc(App.md(d) + ' 空き' + free) + '"><span class="d"><b>' + (+d.slice(8)) + '</b><span>' + App.wd(d) + '</span></span><span class="fr">' + (free ? '空き' + free : '満') + '</span></button>'
              + (i === rowEnd ? dayTable(A.day) : '');
          }).join('') + '</div>');
        });
      }
      $('board').innerHTML = h.join('');
      App.on($('board'), 'button[data-day]', function (b) { A.day = b.getAttribute('data-day'); renderBoard(); });
      App.on($('board'), 'button[data-rid]', function (b) { openDetail(b.getAttribute('data-rid')); });
      App.on($('board'), 'button[data-space]', function (b) {
        // 予約の変更中に台帳の空きを押したら、そこを変更先にする
        if (A.view === 'detail' && A.ctx && A.ctx.step === 'edit') {
          readEdit(); A.ctx.e = { date: b.getAttribute('data-date'), slotId: b.getAttribute('data-slot'), space: b.getAttribute('data-space') };
          renderPanel(); return;
        }
        openRegister(b.getAttribute('data-date'), b.getAttribute('data-slot'), b.getAttribute('data-space'));
      });
      App.on($('board'), 'button[data-block]', function (b) { openBlockDetail(b.getAttribute('data-block')); });
      App.on($('board'), 'button[data-use]', function (b) { openBlock({ from: b.getAttribute('data-date'), slots: [b.getAttribute('data-slot')], spaces: [b.getAttribute('data-use')], reason: '管理者が使う' }); });
    }

    var lastWide = window.matchMedia('(min-width: 900px)').matches;
    window.addEventListener('resize', function () { var w = window.matchMedia('(min-width: 900px)').matches; if (w !== lastWide) { lastWide = w; if (A.mode === 'week') renderBoard(); } });

    function goPage(p) { A.page = p; A.day = null; loadBoard(); window.scrollTo(0, 0); }
    $('prev').onclick = function () { if (A.mode === 'month') { A.month = App.shiftMonth(A.month, -1); A.exported = null; return loadMonth(); } goPage(prevPage(A.page)); };
    $('next').onclick = function () { if (A.mode === 'month') { A.month = App.shiftMonth(A.month, 1); A.exported = null; return loadMonth(); } goPage(nextPage(A.page)); };
    $('this').onclick = function () { setMode('week'); goPage(null); };

    // ------------------------------------------------------------ 予約表（これまでの Excel の「駐車場予約表」と同じ形の、月の表）
    function setMode(m) {
      A.mode = m;
      $('sheetview').setAttribute('aria-pressed', String(m === 'month'));
      $('app').classList.toggle('month-mode', m === 'month');
      $('board').setAttribute('aria-label', m === 'month' ? '月の予約表' : '台帳');
    }
    $('sheetview').onclick = function () {
      closePanel(true);
      if (A.mode === 'month') { setMode('week'); loadBoard(); return; }

        r.cells.forEach(function (c) {

    // ------------------------------------------------------------ 作業の枠

    // ---- 登録（空き枠から）

        form: A.draft.form, requestId: null });

          + (c.free > 1 ? '<div class="f"><span class="lbl" id="rq-lbl">台数</span><div class="row" role="group" aria-labelledby="rq-lbl">' + q.join('') + '</div></div>' : '')
          + fld('r-name', 'お名前', 'name', 'text', true) + '<div class="two">' + fld('r-building', '棟', 'building', 'text', false, '例：A棟', true) + fld('r-room', '部屋番号', 'room', 'text', true) + '</div>'
          + fld('r-phone', '電話番号', 'phone', 'tel', true) + fld('r-email', 'メール', 'email', 'email', false)

          ['お名前', esc(c.form.name)], ['棟・部屋', esc((c.form.building ? c.form.building + ' ' : '') + c.form.room)], ['電話番号', esc(c.form.phone)], ['メール', esc(c.form.email || 'なし')]])

      }
      if (c.step === 'sending') return '<h2 id="h-panel">登録</h2>' + App.busy('登録しています');
      var r = c.result;

        return App.head('登録しました') + strip + '<div class="ticket"><span>予約番号</span><span class="no">' + esc(r.reservationId) + '</span><span>' + esc(c.form.name) + ' さん</span></div>'
          + '<p>読み上げ：「予約番号は <b>' + esc(String(r.reservationId).split('').join(' ')) + '</b> です」</p>'
          + (c.form.email ? '<button type="button" class="btn wide" id="r-done">閉じる</button>'
            : '<div class="row"><button type="button" class="btn main" id="r-told"' + (c.told ? ' disabled aria-pressed="true"' : '') + '>本人に伝えた</button><button type="button" class="btn" id="r-done">閉じる</button></div>');
      }
      if (r.status === 'REJECTED') return App.head('登録できませんでした') + strip + App.note('ng', r.reasonText || 'この内容では登録できません', '') + '<button type="button" class="btn wide" id="r-done">閉じる</button>';

    function fld(id, label, key, type, req, ph, noOpt) {
      return '<div class="f"><label for="' + id + '">' + label + (req || noOpt ? '' : '<span class="opt">なくても可</span>') + '</label><input class="in" id="' + id + '" type="' + type + '" autocomplete="off"'
        + (type === 'tel' ? ' inputmode="tel"' : '') + (ph || type === 'tel' ? ' placeholder="' + esc(ph || App.TEL_EXAMPLE) + '"' : '') + ' value="' + esc(A.ctx.form[key]) + '"></div>';
    }
    function readF() { ['name', 'building', 'room', 'phone', 'email'].forEach(function (k) { var el = $('r-' + k); if (el) A.ctx.form[k] = el.value.trim(); }); }
    function sendRegister() {
      var c = A.ctx; if (c.step === 'sending') return;
      if (!c.requestId) c.requestId = App.newRequestId();
      var req = { requestId: c.requestId, date: c.date, slotId: c.slotId, quantity: c.quantity, channel: c.channel, preferSpace: c.space,
        name: c.form.name, building: c.form.building, room: c.form.room, phone: c.form.phone, email: c.form.email, receivedAt: new Date().toISOString() };
      c.step = 'sending'; renderPanel();
      adminCall('api_admin_register', req).then(function (r) {
        c.result = r; c.step = 'result'; renderPanel(); App.reveal($('h-panel'));
        if (r.status === 'CONFIRMED') { A.draft = newDraft(); loadBoard(true); if (c.form.email) loadCalls(); }
      }, function (e) { if (e && e.message === 'denied') return; c.result = { status: 'NETWORK' }; c.step = 'result'; renderPanel(); });
    }

    // ---- 予約の詳細と取消し
    function openDetail(rid) {
      var x = A.byId[rid]; if (!x) return;
      openPanel('detail', { rid: rid, date: x.date, slotId: x.slotId, step: 'view', reason: '' });
    }
    function detailHtml() {
      var c = A.ctx; var x = A.byId[c.rid];
      var info = App.kv([['利用日', esc(App.md(x.date))], ['時間帯', esc(App.slotMark(x.slotId) + ' ' + x.slotLabel + ' ' + x.timeText)], ['区画', plates(x.spaces) || 'なし'], ['台数', x.quantity + '台'],
        ['棟・部屋', esc((x.building ? x.building + ' ' : '') + x.room)], ['電話番号', esc(x.phone || 'なし')], ['メール', esc(x.email || 'なし')],
        ['受付', esc(x.channelText)], ['予約番号', '<span class="num">' + esc(x.reservationId) + '</span>'], ['状態', esc(x.state)]]);
      if (c.step === 'edit') return editHtml(c, x);

      if (c.step === 'done') return App.head(x.name + ' さん') + App.note('ok', '取り消しました', '') + App.kv([['取り消した理由', esc(c.reason)]]) + info + '<button type="button" class="btn wide" id="d-done">閉じる</button>';

      }
      return App.head(x.name + ' さん') + info + (x.state === '確定' && !x.archived ? '<div class="row"><button type="button" class="btn main" id="e-start">変更する</button><button type="button" class="btn danger" id="c-start">この予約を取り消す</button></div>' : '');
    }

    // ---- 予約の変更（D-024）。日・時間帯・区画と名前などを直す。PC幅では、台帳の空きを押しても変更先を選べる
    function startEdit() {
      var c = A.ctx; var x = A.byId[c.rid];
      c.e = { date: x.date, slotId: x.slotId, space: x.spaces[0] || '' };
      c.form = { name: x.name, building: x.building, room: x.room, phone: x.phone, email: x.email };
      c.err = ''; c.step = 'edit'; renderPanel(); App.reveal($('h-panel'));
    }
    function editHtml(c, x) {
      var e = c.e;
      return App.head('予約の変更') + '<form id="ef" novalidate>'
        + '<div class="f"><label for="e-date">利用日</label><input class="in" id="e-date" type="date" value="' + esc(e.date) + '"></div>'

        + '<div class="f"><span class="lbl" id="esp-lbl">区画</span><div class="row" role="group" aria-labelledby="esp-lbl">'
        + SPACES.map(function (sp) { return '<button type="button" class="btn" data-esp="' + sp + '" aria-pressed="' + (e.space === sp) + '">' + sp + '番</button>'; }).join('') + '</div></div>'
        + fld('r-name', 'お名前', 'name', 'text', true) + '<div class="two">' + fld('r-building', '棟', 'building', 'text', false, '例：A棟', true) + fld('r-room', '部屋番号', 'room', 'text', true) + '</div>'
        + fld('r-phone', '電話番号', 'phone', 'tel', true) + fld('r-email', 'メール', 'email', 'email', false)
        + '<div id="e-out">' + (c.err ? App.note('ng', '変更できませんでした', c.err) : '') + '</div>'
        + '<div class="row"><button type="submit" class="btn main">確認へ進む</button><button type="button" class="btn" id="e-stop">やめる</button></div></form>';

    function editConfirmHtml(c, x) {
      var e = c.e; var f = c.form; var rows = [];
      var when = function (d, id) { return App.md(d) + ' ' + SLOT_LABEL[id] + ' ' + App.slotShort(id); };
      if (e.date !== x.date || e.slotId !== x.slotId) rows.push(['日と時間帯', esc(when(x.date, x.slotId)) + '<br>→ <b>' + esc(when(e.date, e.slotId)) + '</b>']);
      if (e.space && x.spaces.indexOf(e.space) < 0) rows.push(['区画', esc(x.spaces.join('・')) + ' → <b>' + esc(e.space) + '</b>']);
      [['name', 'お名前'], ['building', '棟'], ['room', '部屋番号'], ['phone', '電話番号'], ['email', 'メール']].forEach(function (p) {
        if ((x[p[0]] || '') !== (f[p[0]] || '')) rows.push([p[1], esc(x[p[0]] || 'なし') + ' → <b>' + esc(f[p[0]] || 'なし') + '</b>']);
      });
      if (!rows.length) rows.push(['変更', '変わるところはありません']);
      return App.head('この内容に変更しますか') + App.kv(rows)
        + (c.err ? App.note('wait', '通信が途中で切れた可能性があります', c.err) : '')
        + '<div class="row"><button type="button" class="btn main" id="e-send">変更する</button><button type="button" class="btn" id="e-fix">直す</button></div>';
    }
    function readEdit() { readF(); var d = $('e-date'); if (d) A.ctx.e.date = d.value; }
    function sendEdit() {

        if (r.status === 'CHANGED') {

    /** 作業の枠を「読み込んでいます」で開き、届いたら ctx[key] に入れて描き直す（その間に別の枠を開いていたら何もしない） */

    function callsHtml(items) {

    // ---- 使用禁止（期間×時間帯×駐車場をまとめて止める）
    function openBlock(o) {
      o = o || {};
      var first = pageFrom() > TODAY ? pageFrom() : TODAY;
      openPanel('block', { step: 'form', from: o.from || first, to: o.to || o.from || first,
        slots: o.slots || IDS.slice(), spaces: o.spaces || SPACES.slice(), reason: o.reason || '工事・点検', memo: '', requestId: null, preview: null, result: null });
    }
    function scopeText(slots, spaces) {
      var t = !slots.length || slots.length === IDS.length ? '終日' : slots.map(function (x) { return SLOT_LABEL[x]; }).join('・');
      var p = !spaces.length || spaces.length === SPACES.length ? '全ての駐車場' : spaces.map(function (x) { return x + '番'; }).join('・');
      return { t: t, p: p };
    }
    function periodText(from, to) { return from === to ? App.md(from) : App.md(from) + '〜' + App.md(to); }
    function blockHtml() {
      var c = A.ctx;
      if (c.step === 'form') {
        var tg = function (attr, v, text, on) { return '<button type="button" class="btn" ' + attr + '="' + v + '" aria-pressed="' + on + '">' + text + '</button>'; };
        return App.head('使用禁止にする') + '<form id="bf" novalidate>'
          + '<div class="two dates"><div class="f"><label for="b-from">開始日</label><input class="in" id="b-from" type="date" min="' + TODAY + '" value="' + esc(c.from) + '"></div>'
          + '<div class="f"><label for="b-to">終了日</label><input class="in" id="b-to" type="date" min="' + TODAY + '" value="' + esc(c.to) + '"></div></div>'
          + '<div class="f"><span class="lbl" id="bs-lbl">時間帯</span><div class="row wrap" role="group" aria-labelledby="bs-lbl">'
          + tg('data-ball', 's', '終日', c.slots.length === IDS.length) + IDS.map(function (x) { return tg('data-bs', x, SLOT_LABEL[x], c.slots.length !== IDS.length && c.slots.indexOf(x) >= 0); }).join('') + '</div></div>'
          + '<div class="f"><span class="lbl" id="bp-lbl">駐車場</span><div class="row wrap" role="group" aria-labelledby="bp-lbl">'
          + tg('data-pall', 'p', '全て', c.spaces.length === SPACES.length) + SPACES.map(function (x) { return tg('data-bp', x, x + '番', c.spaces.length !== SPACES.length && c.spaces.indexOf(x) >= 0); }).join('') + '</div></div>'
          + '<div class="f"><span class="lbl" id="br-lbl">理由</span><div class="row wrap" role="group" aria-labelledby="br-lbl">'
          + BLOCK_REASONS.map(function (x) { return tg('data-br', x, x, c.reason === x); }).join('') + '</div></div>'
          + '<div class="f"><label for="b-memo">メモ<span class="opt">なくても可</span></label><input class="in" id="b-memo" autocomplete="off" value="' + esc(c.memo) + '"></div>'
          + '<button type="submit" class="btn main wide">確認へ進む</button></form><div id="b-out"></div>';
      }
      var sc = scopeText(c.slots, c.spaces);
      var info = App.kv([['期間', esc(periodText(c.from, c.to))], ['時間帯', esc(sc.t)], ['駐車場', esc(sc.p)], ['理由', esc(c.reason)]].concat(c.memo ? [['メモ', esc(c.memo)]] : []));
      var conf = function (list) {
        if (!list || !list.length) return '';
        return '<h3>重なる予約（' + list.length + '件）</h3><table class="list"><tbody>' + list.map(function (x) {
          return '<tr><td>' + esc(App.md(x.date)) + '<br>' + esc(App.slotMark(x.slotId) + ' ' + x.slotLabel) + ' ' + plates(x.spaces) + '</td>'
            + '<td><button type="button" class="btn plain" data-open="' + esc(x.reservationId) + '">' + esc(x.name) + '</button><br><span class="num sub">' + esc(x.phone || '') + '</span></td></tr>';
        }).join('') + '</tbody></table>';
      };
      if (c.step === 'confirm') {
        return App.head('この内容で使用禁止にしますか') + info + conf(c.preview.conflicts)
          + '<div class="row"><button type="button" class="btn main" id="b-send">使用禁止にする</button><button type="button" class="btn" id="b-fix">直す</button></div><div id="b-out"></div>';
      }
      if (c.step === 'sending') return '<h2 id="h-panel">使用禁止</h2>' + App.busy('登録しています');
      return App.head('使用禁止にしました') + info + conf(c.result.conflicts) + '<button type="button" class="btn wide" id="b-done">閉じる</button>';
    }
    function readBlockForm() {
      var c = A.ctx;
      if ($('b-from')) c.from = $('b-from').value;
      if ($('b-to')) c.to = $('b-to').value;
      if ($('b-memo')) c.memo = $('b-memo').value.trim();
    }
    function checkBlock() {
      var c = A.ctx; var e = {};
      if (!/^\d{4}-\d{2}-\d{2}$/.test(c.from)) e['b-from'] = '開始日を入れてください';
      else if (c.from < TODAY) e['b-from'] = '過ぎた日は選べません';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(c.to)) e['b-to'] = '終了日を入れてください';
      else if (c.from && c.to < c.from) e['b-to'] = '開始日より後の日にしてください';
      return e;
    }
    function blockReq(confirm) {
      var c = A.ctx;
      if (!c.requestId) c.requestId = App.newRequestId();
      return { requestId: c.requestId, from: c.from, to: c.to, slots: c.slots, spaces: c.spaces, reason: c.reason, memo: c.memo, confirm: confirm };
    }
    function blockListHtml(list) {
      if (!list.length) return '<p>ありません</p>';
      return '<table class="list"><tbody>' + list.map(function (b) {
        var sc = scopeText(b.slots, b.spaces);
        return '<tr><td><b>' + esc(periodText(b.from, b.to)) + '</b><br>' + esc(sc.t) + ' ' + esc(sc.p) + '<br><span class="sub">' + esc(b.reason + (b.memo ? '（' + b.memo + '）' : '')) + '</span></td>'
          + '<td><button type="button" class="btn" data-release="' + esc(b.blockId) + '">解除</button></td></tr>';
      }).join('') + '</tbody></table>';
    }
    function openBlocks() {
      openLoaded('blocks', { list: null }, 'list', adminCall('api_admin_blockList', {}).then(function (r) {
        (r.blocks || []).forEach(function (b) { A.blockById[b.blockId] = b; }); return r.blocks;
      }));
    }
    $('blocks').onclick = openBlocks;
    function openBlockDetail(id) { if (A.blockById[id]) openPanel('blockDetail', { blockId: id, step: 'view' }); }
    function blockDetailHtml() {
      var c = A.ctx; var b = A.blockById[c.blockId]; var sc = scopeText(b.slots, b.spaces);
      var info = App.kv([['期間', esc(periodText(b.from, b.to))], ['時間帯', esc(sc.t)], ['駐車場', esc(sc.p)], ['理由', esc(b.reason)]].concat(b.memo ? [['メモ', esc(b.memo)]] : []).concat([['登録', esc(String(b.operator).replace(/\s*<.*>$/, ''))]]));
      if (c.step === 'done') return App.head('使用禁止') + App.note('ok', '解除しました', '') + info + '<button type="button" class="btn wide" id="d-done">閉じる</button>';
      return App.head('使用禁止') + info + '<button type="button" class="btn danger wide" data-release="' + esc(b.blockId) + '">この使用禁止を解除する</button><div id="b-out"></div>';
    }
    function release(id, btn) {
      btn.disabled = true;
      adminCall('api_admin_releaseBlock', { blockId: id }).then(function (r) {
        if (r.status !== 'OK') { btn.disabled = false; return; }
        if (A.view === 'blockDetail') { A.ctx.step = 'done'; renderPanel(); }
        else if (A.view === 'blocks') { A.ctx.list = A.ctx.list.filter(function (b) { return b.blockId !== id; }); renderPanel(); }
        loadBoard(true);
      }, function () { btn.disabled = false; });
    }

    function bindPanel() {
      var p = $('panel'); var c = A.ctx;
      if (A.view === 'register') {
        App.on(p, 'button[data-ch]', function (b) { readF(); c.channel = A.draft.channel = b.getAttribute('data-ch'); renderPanel(); });
        if ($('rf')) $('rf').oninput = function () { readF(); };
        App.on(p, 'button[data-q]', function (b) { readF(); c.quantity = +b.getAttribute('data-q'); renderPanel(); });
        if ($('rf')) $('rf').onsubmit = function (e) {
          e.preventDefault(); readF();
          if (!App.showErrors($('rf'), App.personErrors(c.form, 'r-'))) return;
          c.step = 'confirm'; renderPanel(); App.reveal($('h-panel'));
        };
        if ($('r-send')) $('r-send').onclick = sendRegister;
        if ($('r-block')) $('r-block').onclick = function () { openBlock({ from: c.date, slots: [c.slotId], spaces: [c.space], reason: '管理者が使う' }); };
        if ($('r-fix')) $('r-fix').onclick = function () { c.step = 'form'; renderPanel(); };
        if ($('r-done')) $('r-done').onclick = function () { closePanel(); loadCalls(); };
        if ($('r-told')) $('r-told').onclick = function () {
          $('r-told').disabled = true;
          adminCall('api_admin_markCalled', { reservationId: c.result.reservationId }).then(function () { c.told = true; renderPanel(); loadCalls(); }, function () { $('r-told').disabled = false; });
        };
      }
      if (A.view === 'detail') {
        if ($('c-start')) $('c-start').onclick = function () { c.step = 'cancel'; renderPanel(); };
        if ($('e-start')) $('e-start').onclick = startEdit;
        if ($('ef')) {
          $('ef').oninput = function () { readEdit(); };
          $('ef').onsubmit = function (ev) {
            ev.preventDefault(); readEdit();
            var errs = {};
            if (!/^\d{4}-\d{2}-\d{2}$/.test(c.e.date)) errs['e-date'] = '利用日を選んでください';
            var pe = App.personErrors(c.form, 'r-');
            Object.keys(pe).forEach(function (k) { errs[k] = pe[k]; });
            if (!App.showErrors($('ef'), errs)) return;
            c.err = ''; c.step = 'editConfirm'; renderPanel(); App.reveal($('h-panel'));
          };
        }
        App.on(p, 'button[data-es]', function (b) { readEdit(); c.e.slotId = b.getAttribute('data-es'); renderPanel(); });
        App.on(p, 'button[data-esp]', function (b) { readEdit(); c.e.space = b.getAttribute('data-esp'); renderPanel(); });
        if ($('e-stop')) $('e-stop').onclick = function () { c.step = 'view'; c.err = ''; renderPanel(); };
        if ($('e-fix')) $('e-fix').onclick = function () { c.step = 'edit'; c.err = ''; renderPanel(); };
        if ($('e-send')) $('e-send').onclick = sendEdit;
        App.on(p, 'button[data-why]', function (b) { c.reason = b.getAttribute('data-why'); renderPanel(); $('c-go').focus(); });
        if ($('c-go')) $('c-go').onclick = doCancel;
        if ($('c-stop')) $('c-stop').onclick = function () { c.step = 'view'; renderPanel(); };
        if ($('d-done')) $('d-done').onclick = function () { closePanel(); };
      }
      if (A.view === 'block') {
        var setSel = function (key, all, v) {
          readBlockForm();
          if (v === null) c[key] = all.slice();
          else if (c[key].length === all.length) c[key] = [v];
          else if (c[key].indexOf(v) >= 0) { c[key] = c[key].filter(function (x) { return x !== v; }); if (!c[key].length) c[key] = all.slice(); }
          else c[key] = all.filter(function (x) { return c[key].indexOf(x) >= 0 || x === v; });
          renderPanel();
        };
        App.on(p, 'button[data-ball]', function () { setSel('slots', IDS, null); });
        App.on(p, 'button[data-bs]', function (b) { setSel('slots', IDS, b.getAttribute('data-bs')); });
        App.on(p, 'button[data-pall]', function () { setSel('spaces', SPACES, null); });
        App.on(p, 'button[data-bp]', function (b) { setSel('spaces', SPACES, b.getAttribute('data-bp')); });
        App.on(p, 'button[data-br]', function (b) { readBlockForm(); c.reason = b.getAttribute('data-br'); renderPanel(); });
        if ($('bf')) $('bf').onsubmit = function (e) {
          e.preventDefault(); readBlockForm();
          if (!App.showErrors($('bf'), checkBlock())) return;
          $('b-out').innerHTML = App.busy('重なる予約を調べています');
          adminCall('api_admin_addBlock', blockReq(false)).then(function (r) {
            if (r.status !== 'PREVIEW') { $('b-out').innerHTML = App.note('ng', r.reasonText || '登録できません', ''); return; }
            c.preview = r; c.step = 'confirm'; renderPanel(); App.reveal($('h-panel'));
          }, function (e2) { if (e2 && e2.message === 'denied') return; $('b-out').innerHTML = App.note('wait', '通信がつながりませんでした', ''); });
        };
        if ($('b-fix')) $('b-fix').onclick = function () { c.step = 'form'; renderPanel(); };
        if ($('b-send')) $('b-send').onclick = function () {
          c.step = 'sending'; renderPanel();
          adminCall('api_admin_addBlock', blockReq(true)).then(function (r) {
            if (r.status !== 'OK') { c.step = 'confirm'; renderPanel(); $('b-out').innerHTML = App.note('ng', r.reasonText || '登録できませんでした', ''); return; }
            c.result = r; c.step = 'done'; renderPanel(); App.reveal($('h-panel')); loadBoard(true);
          }, function (e2) { if (e2 && e2.message === 'denied') return; c.step = 'confirm'; renderPanel(); $('b-out').innerHTML = App.note('wait', '通信がつながりませんでした。もう一度押してください', ''); });
        };
        if ($('b-done')) $('b-done').onclick = function () { closePanel(); };
      }
      if (A.view === 'blocks' && $('b-new')) $('b-new').onclick = function () { openBlock(); };
      if (A.view === 'blockDetail' && $('d-done')) $('d-done').onclick = function () { closePanel(); };
      App.on(p, 'button[data-release]', function (b) { release(b.getAttribute('data-release'), b); });
      App.on(p, 'button[data-open]', function (b) { openDetail(b.getAttribute('data-open')); });
      App.on(p, 'button[data-called]', function (b) {
        b.disabled = true;
        adminCall('api_admin_markCalled', { reservationId: b.getAttribute('data-called') }).then(function () {
          return loadCalls();
        }).then(function (items) { if (A.view === 'calls') { A.ctx.items = items || []; renderPanel(); } }, function () { b.disabled = false; });
      });
    }

    if (A.token) showApp(); else showLogin();
  }());
  </script>
</body>
</html>
